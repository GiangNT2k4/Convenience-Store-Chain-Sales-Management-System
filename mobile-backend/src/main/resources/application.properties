spring.application.name=cscsms-customer-api
server.port=4314

# Set DB credentials via environment variables (do not commit real secrets).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chuoi_cua_hang}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Loyalty rates (must match staff POS BE)
loyalty.vnd-per-point=10000
loyalty.point-value-vnd=1000

# Customer-only JWT (different secret from staff BE)
customer.jwt.secret=${CUSTOMER_JWT_SECRET:}
customer.jwt.expiration-ms=${CUSTOMER_JWT_EXPIRATION_MS:360000000}

# Email OTP (otp.mock=true uses fixed mock-code; still attempts SMTP send)
otp.mock=${OTP_MOCK:true}
otp.ttl-seconds=300
otp.resend-cooldown-seconds=45
otp.max-attempts=5
otp.mock-code=123456

# SMTP — set MAIL_USERNAME / MAIL_PASSWORD via environment
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Role id for CUSTOMER in shared roles table
customer.role-id=7

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
