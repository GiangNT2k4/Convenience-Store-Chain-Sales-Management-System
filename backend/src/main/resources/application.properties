spring.application.name=api
server.port=4313

# Set DB credentials via environment variables (do not commit real secrets).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chuoi_cua_hang}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# false = fast boot against shared remote DB (schema/catalog already applied).
# true  = run all *Migration / *Seeder beans once (empty DB or intentional re-seed).
app.startup.bootstrap-enabled=false

# DB already has schema + FK — do not auto ALTER tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.security.user.name=admin
spring.security.user.password=${SPRING_SECURITY_PASSWORD:changeme}
spring.security.user.roles=ADMIN

# Hidden / externalized — set via environment variables (defaults are for local dev)
url.client-url=${CLIENT_URL:http://localhost:5175}
url.api-url=${API_URL:http://localhost:4313}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp

# Set MAIL_USERNAME and MAIL_PASSWORD via environment variables
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false

spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.debug=false

# Demo OTP for email verification (branch suspend, critical user actions, email verify).
# Default false for safer shared/UAT deploys; set OTP_MOCK=true for local demos.
otp.mock=${OTP_MOCK:false}
otp.mock-code=${OTP_MOCK_CODE:123456}

# TODO: replace with per-product reorder_point from DB when available.
purchase-request.default-reorder-point=10

# Auto-deactivate ACTIVE promotions after endAt (ms between runs).
campaign.expiry-check-ms=60000

# Default opening cash for the first shift of the day (VND). Later shifts inherit
# actual_cash from the previous closed session.
shift.default-opening-cash=2000000

# Team QA: allow cashiers to open/close shifts outside branch operating hours.
# Keep false on shared/UAT; set SHIFT_TEST_MODE_ALLOW_OUTSIDE_HOURS=true locally if needed.
shift.test-mode.allow-outside-hours=${SHIFT_TEST_MODE_ALLOW_OUTSIDE_HOURS:false}

# Auto-close cashier sessions still open this many minutes after shift end time.
shift.auto-close.grace-minutes=30
# How often the overdue-shift job runs (ms).
shift.overdue-check-ms=300000

# Loyalty earn/redeem rates. Server is source of truth; FE only displays.
loyalty.vnd-per-point=10000
loyalty.point-value-vnd=1000

# Customer mobile API. Schema migration is idempotent; demo rows are inserted only when missing.
app.customer-schema-migration-enabled=${CUSTOMER_SCHEMA_MIGRATION_ENABLED:true}
customer.jwt.expiration-ms=${CUSTOMER_JWT_EXPIRATION_MS:360000000}
otp.ttl-seconds=${OTP_TTL_SECONDS:300}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:45}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}

# ── PayOS – QR bank transfer gateway (set real keys via env) ─────────
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5175/pos/payment/payos}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5175/pos/payment/payos}
